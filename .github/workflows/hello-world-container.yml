name: Hello World Container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/hello-world-container.yml
  workflow_dispatch:

jobs:
  build-run-destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        id: build
        run: docker build -t hello-world:ci .

      - name: Run container
        id: run
        if: success()
        run: |
          container_id=$(docker run -d hello-world:ci)
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
          echo "Started container $container_id"

      - name: Wait 10 seconds
        if: steps.run.outcome == 'success'
        run: |
          docker ps --filter "id=${{ steps.run.outputs.container_id }}"
          sleep 10
          echo "10 seconds elapsed"

      - name: Stop container
        if: always() && steps.run.outputs.container_id != ''
        run: docker stop "${{ steps.run.outputs.container_id }}"

      - name: Remove container
        if: always() && steps.run.outputs.container_id != ''
        run: docker rm "${{ steps.run.outputs.container_id }}"

      - name: Remove image
        if: always()
        run: docker rmi hello-world:ci --force || true
